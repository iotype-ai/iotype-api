# Alias distribution: `pip install iotype` installs `iotype-ai`.
#
# This package deliberately contains no modules. `iotype-ai` is what provides
# the importable `iotype` package, so shipping one here would collide with it.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iotype"
version = "1.0.0"
description = "Alias for iotype-ai — the official Python SDK for the iotype API (Persian speech recognition, OCR, translation and text-to-speech)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "iotype" }]
keywords = ["iotype", "persian", "farsi", "asr", "speech-to-text", "ocr", "tts", "translation"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Text Processing :: Linguistic",
]

# The whole point of the package.
dependencies = ["iotype-ai>=1.0"]

[project.urls]
Homepage = "https://iotype.com"
Documentation = "https://iotype.com/api-service"
"API Reference" = "https://iotype.com/api-service/authentication"
Pricing = "https://iotype.com/plans/api"
Source = "https://github.com/iotype-ai/iotype-api"

[tool.hatch.build.targets.wheel]
# Metadata-only wheel — there is nothing to package.
bypass-selection = true
