[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iotype-ai"
version = "1.0.0"
description = "Official Python SDK for iotype (iotype.com) — Persian, English and Arabic speech recognition, OCR, translation and text-to-speech."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "iotype" }]
keywords = ["iotype", "persian", "farsi", "asr", "speech-to-text", "speech-recognition",
            "ocr", "persian-ocr", "tts", "text-to-speech", "translation", "nlp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
realtime = ["websocket-client>=1.6"]
dev = ["pytest>=7", "ruff>=0.16,<0.17", "mypy>=1.8", "types-requests"]

[project.urls]
Homepage = "https://iotype.com"
Documentation = "https://iotype.com/api-service"
"API Reference" = "https://iotype.com/api-service/authentication"
Pricing = "https://iotype.com/plans/api"
Source = "https://github.com/iotype-ai/iotype-api"
Issues = "https://github.com/iotype-ai/iotype-api/issues"

[tool.hatch.build.targets.wheel]
packages = ["iotype"]

[tool.ruff]
line-length = 100
target-version = "py39"

# Pin the rule set explicitly. Relying on ruff's defaults means CI breaks
# whenever ruff widens them — which is what happened on the first run.
[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # import sorting
  "UP",       # pyupgrade
  "B",        # bugbear
  "C4",       # comprehensions
  "SIM",      # simplify
  "RUF",      # ruff-specific
]
ignore = [
  # `Self` is Python 3.11+, and this package supports 3.9 without pulling in
  # typing_extensions. Returning the concrete class is correct here.
  "PYI034",
  # Long lines inside docstrings and URLs are fine.
  "E501",
]
