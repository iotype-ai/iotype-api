[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iotype-ai"
version = "1.0.0"
description = "Official Python SDK for iotype (iotype.com) — Persian, English and Arabic speech recognition, OCR, translation and text-to-speech."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "iotype" }]
keywords = ["iotype", "persian", "farsi", "asr", "speech-to-text", "speech-recognition",
            "ocr", "persian-ocr", "tts", "text-to-speech", "translation", "nlp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
realtime = ["websocket-client>=1.6"]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8", "types-requests"]

[project.urls]
Homepage = "https://iotype.com"
Documentation = "https://iotype.com/api-service"
"API Reference" = "https://iotype.com/api-service/authentication"
Pricing = "https://iotype.com/plans/api"
Source = "https://github.com/iotype-ai/iotype-api"
Issues = "https://github.com/iotype-ai/iotype-api/issues"

[tool.hatch.build.targets.wheel]
packages = ["iotype"]

[tool.ruff]
line-length = 100
target-version = "py39"
