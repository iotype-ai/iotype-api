asyncapi: 3.0.0

info:
  title: iotype Realtime ASR
  version: "1.1.0"
  description: |
    Streaming speech recognition over a secure WebSocket.

    **This specification is written from a working, tested browser client**
    (`examples/browser-asr/`), not from prose. Where it disagreed with the
    published website documentation, the client won.

    **Lifecycle**

    1. Open a WebSocket to `wss://iotype.com/socket/realtime`.
    2. Send the `Initialize` message. Its fields are nested inside a `config`
       object: `{"config":{"model":"io-fa","type":"access_token","token":"..."}}`
    3. **Wait for the `AuthResult` reply.** Send no audio before it arrives —
       it carries the `sample_rate` you must resample to.
    4. Stream raw PCM audio as binary frames at that sample rate.
    5. Receive `{"partial": "..."}` while the speaker talks, and
       `{"text": "..."}` when an utterance settles.
    6. Send `{"eof": 1}` to flush the decoder, then close a few seconds later.

    **Audio format** — PCM linear 16-bit, mono, little-endian, at the
    `sample_rate` the server returned. Do not assume a fixed rate; the browser's
    `AudioContext` typically runs at 48000 Hz and must be resampled. Do not
    base64-encode. Prefer 20 ms frames.

    **Token choice** — use a `flash_token` from any client you do not control
    (browser, Android, iOS, desktop). Use an `access_token` only for
    server-to-server connections where the secret stays on your server.

  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  externalDocs:
    url: https://iotype.com/api-service/speech-to-text

servers:
  production:
    host: iotype.com
    pathname: /socket/realtime
    protocol: wss
    description: Production realtime ASR endpoint.

channels:
  realtime:
    address: /socket/realtime
    title: Realtime ASR session
    messages:
      initialize:
        $ref: '#/components/messages/Initialize'
      authResult:
        $ref: '#/components/messages/AuthResult'
      audioChunk:
        $ref: '#/components/messages/AudioChunk'
      endOfStream:
        $ref: '#/components/messages/EndOfStream'
      partialResult:
        $ref: '#/components/messages/PartialResult'
      finalResult:
        $ref: '#/components/messages/FinalResult'

operations:
  startSession:
    action: send
    channel:
      $ref: '#/channels/realtime'
    summary: Authenticate and select a recognition model
    description: |
      Must be the first message on the socket. Send no audio until the
      `AuthResult` reply has been received.
    messages:
      - $ref: '#/channels/realtime/messages/initialize'
    reply:
      channel:
        $ref: '#/channels/realtime'
      messages:
        - $ref: '#/channels/realtime/messages/authResult'

  streamAudio:
    action: send
    channel:
      $ref: '#/channels/realtime'
    summary: Stream raw audio frames
    messages:
      - $ref: '#/channels/realtime/messages/audioChunk'

  endStream:
    action: send
    channel:
      $ref: '#/channels/realtime'
    summary: Flush the decoder and request the last result
    messages:
      - $ref: '#/channels/realtime/messages/endOfStream'

  receiveResults:
    action: receive
    channel:
      $ref: '#/channels/realtime'
    summary: Receive interim and finalised transcripts
    messages:
      - $ref: '#/channels/realtime/messages/partialResult'
      - $ref: '#/channels/realtime/messages/finalResult'

components:

  messages:

    Initialize:
      name: initialize
      title: Initialize session
      contentType: application/json
      summary: |
        First message on the socket. The three fields are nested inside a
        `config` envelope — they are not top-level.
      payload:
        type: object
        required: [config]
        properties:
          config:
            type: object
            required: [type, token]
            properties:
              model:
                $ref: '#/components/schemas/Model'
              type:
                $ref: '#/components/schemas/TokenType'
              token:
                type: string
                description: The Access Token or Flash Token value.
      examples:
        - name: browserClient
          payload:
            config:
              model: "io-fa"
              type: "flash_token"
              token: "YOUR_FLASH_TOKEN"
        - name: serverClient
          payload:
            config:
              model: "io-en"
              type: "access_token"
              token: "YOUR_ACCESS_TOKEN"

    AuthResult:
      name: authResult
      title: Authentication result
      contentType: application/json
      summary: |
        The server's reply to `Initialize`. **Wait for this before sending
        audio** — `sample_rate` tells you what rate to resample to.

        On failure the payload carries `error` instead, and the server closes
        the connection.
      payload:
        oneOf:
          - type: object
            title: Authorized
            required: [status]
            properties:
              status:
                type: string
                const: authorized
              model:
                $ref: '#/components/schemas/Model'
              sample_rate:
                type: integer
                description: |
                  The sample rate, in Hz, that the server expects audio at.
                  Resample your capture to exactly this value. It is not fixed
                  across deployments — read it, do not hardcode it.
                examples: [44100, 16000]
          - type: object
            title: Rejected
            required: [error]
            properties:
              error:
                type: string
                description: Why authentication failed, e.g. `unauthorized`.
      examples:
        - name: authorized
          payload:
            status: "authorized"
            model: "io-fa"
            sample_rate: 44100
        - name: rejected
          payload:
            error: "unauthorized"

    AudioChunk:
      name: audioChunk
      title: Audio frame
      contentType: application/octet-stream
      summary: |
        Raw PCM 16-bit mono little-endian audio at the negotiated
        `sample_rate`, sent as a binary frame. 20 ms per frame is a good
        default — `sample_rate / 50` samples.
      payload:
        type: string
        format: binary

    EndOfStream:
      name: eof
      title: End of stream
      contentType: application/json
      summary: |
        Tells the server no more audio is coming and to flush its decoder. The
        last `FinalResult` arrives shortly afterwards, so wait a few seconds
        before closing the socket rather than closing immediately.
      payload:
        type: object
        required: [eof]
        properties:
          eof:
            type: integer
            const: 1
      examples:
        - name: endSession
          payload:
            eof: 1

    PartialResult:
      name: partial
      title: Partial result
      contentType: application/json
      summary: |
        Interim transcript emitted while the speaker is mid-utterance. It may
        be revised by later messages. Render it, but do not persist it.

        Identified by the presence of the `partial` key. An empty string means
        the interim hypothesis was cleared.
      payload:
        type: object
        required: [partial]
        properties:
          partial:
            type: string
      examples:
        - name: interim
          payload:
            partial: "سلام حال"

    FinalResult:
      name: final
      title: Final result
      contentType: application/json
      summary: |
        Settled transcript for one utterance, emitted at a pause or after
        `eof`. It will not change. Persist this. Recognition continues
        afterwards, so a session yields many of these.

        Identified by the presence of the `text` key. It may be an empty
        string when an utterance produced nothing — check before appending.
      payload:
        type: object
        required: [text]
        properties:
          text:
            type: string
      examples:
        - name: settled
          payload:
            text: "سلام حال شما چطور است؟"

  schemas:

    Model:
      type: string
      enum: [io-fa, io-en, io-ar]
      description: |
        Recognition model.
        `io-fa` Persian, `io-en` English, `io-ar` Arabic.
        Matching the model to the spoken language materially improves accuracy.
        The server echoes the selected model back in `AuthResult`.

    TokenType:
      type: string
      enum: [access_token, flash_token]
      description: |
        Which kind of credential `token` holds. Use `flash_token` for any
        client-side application.
